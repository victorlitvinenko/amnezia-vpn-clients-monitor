services:
  vpn-dashboard:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8080}
      AMNEZIA_CONTAINER: ${AMNEZIA_CONTAINER:-amnezia-awg2}
      AMNEZIA_INTERFACE: ${AMNEZIA_INTERFACE:-awg0}
      ONLINE_THRESHOLD_SECONDS: ${ONLINE_THRESHOLD_SECONDS:-180}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-3000}
    ports:
      - '${HOST_PORT:-8080}:${PORT:-8080}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:' + process.env.PORT + '/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
